name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Echopad-Setup
          path: release/Echopad-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Echopad ${{ github.ref_name }}
          files: release/Echopad-Setup-*.exe
          body: |
            ## Install
            1. Download **Echopad-Setup-*.exe** below and double-click it.
            2. If Windows SmartScreen appears, click **More info → Run anyway** (the installer isn't code-signed).
            3. Install the free [VB-CABLE](https://vb-audio.com/Cable/) driver, then in Discord set **Input Device** to **CABLE Output**.
