name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Echopad-Setup
          path: release/Echopad-Setup-*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Echopad v${{ steps.ver.outputs.version }}
          make_latest: true
          files: release/Echopad-Setup-*.exe
          body: |
            ## Install
            1. Download **Echopad-Setup-*.exe** below and double-click it.
            2. If Windows SmartScreen appears, click **More info → Run anyway** (the installer isn't code-signed).
            3. Install the free [VB-CABLE](https://vb-audio.com/Cable/) driver, then in Discord set **Input Device** to **CABLE Output**.
