name: Windows end-to-end test

# Runs the packaged Echopad.exe on a throwaway Windows VM with VB-CABLE installed, then recreates the
# "driver files present but device missing" case: Echopad must diagnose it and recover after a reinstall.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack
      - name: Start Windows audio services
        shell: pwsh
        run: |
          foreach ($s in 'AudioEndpointBuilder','Audiosrv') { Set-Service $s -StartupType Automatic; Start-Service $s -ErrorAction Continue }
      - name: Verify VB-Audio's real installer passes Echopad's signature check
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip -OutFile vb.zip
          Expand-Archive vb.zip vb
          $v = release\win-unpacked\resources\bin\EchopadAudio.exe verify vb\VBCABLE_Setup_x64.exe
          Write-Host $v
          if (-not ($v | ConvertFrom-Json).ok) { throw "signature check rejects VB-Audio's installer" }
      - name: Install VB-CABLE on the test VM (VB-Audio's own silent mode)
        shell: pwsh
        run: |
          $p = Start-Process vb\VBCABLE_Setup_x64.exe -ArgumentList '-i','-h' -WorkingDirectory vb -PassThru -Wait
          Write-Host "VB-Audio installer exit code: $($p.ExitCode)"
          Start-Sleep 15
      - name: End-to-end (installed → half-installed → repaired)
        shell: pwsh
        run: |
          npm i --no-save playwright@1.57.0
          node scripts/ci/e2e-windows.cjs
      - name: Windows driver install log (tail)
        if: always()
        shell: pwsh
        run: Get-Content C:\Windows\INF\setupapi.dev.log -Tail 150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-*.png
